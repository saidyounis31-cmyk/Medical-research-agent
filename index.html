<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAKIM | الوكيل الطبي والعلمي الذكي</title>
<style>
:root{--ink:#17313a;--muted:#5b7078;--line:#d6e1e4;--paper:#fff;--bg:#f3f7f7;--teal:#126b65;--teal2:#e8f5f2;--gold:#b88a3b;--warn:#fff6df;--shadow:0 12px 32px rgba(25,57,65,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.65}.wrap{max-width:1120px;margin:auto;padding:24px 16px 48px}
.hero{background:linear-gradient(135deg,#0d353d,#156b64);color:#fff;padding:28px;border-radius:22px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.lang-box{background:rgba(255,255,255,.15);padding:8px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.28)}
.lang-box label{font-size:.88rem;font-weight:700;color:#fff;margin:0}
.lang-box select{padding:7px 12px;border-radius:8px;border:0;font-weight:700;background:#fff;color:var(--ink);width:auto;cursor:pointer}
.eyebrow{font-size:.84rem;letter-spacing:.03em;opacity:.92}.hero h1{margin:.3rem 0 .6rem;font-size:clamp(1.6rem,4vw,2.4rem)}.hero p{margin:0;max-width:840px;color:#e4f2f0}
.hero-credit{margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22);font-size:.84rem;color:#f3d89e;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;margin-top:18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:1.2rem;margin:0 0 14px}
.field{margin:16px 0}.field>label,.label{display:block;font-weight:700;margin-bottom:7px}.hint{font-size:.88rem;color:var(--muted);margin-top:4px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;transition:.15s;background:#fff}
.choice:has(input:checked){border-color:var(--teal);background:var(--teal2)}.choice input{margin-top:5px;accent-color:var(--teal);flex:0 0 auto}.choice strong{display:block;font-size:.94rem}.choice small{display:block;color:var(--muted);font-size:.8rem;line-height:1.45;margin-top:3px}
select,textarea,input[type=text],input[type=date]{font:inherit;width:100%;padding:11px 12px;border:1px solid #bdcdd1;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:94px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.btn{border:0;border-radius:11px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:#eaf0f1;color:var(--ink)}.gold{background:#f7eedc;color:#65491a}
.btn:disabled{opacity:.6;cursor:wait}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #83c9bd;outline-offset:2px}
.preview{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7faf9;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:220px;font-size:.92rem}
.status{display:inline-block;border-radius:999px;padding:4px 10px;background:var(--warn);color:#765313;font-size:.82rem;font-weight:700}
.status.ok{background:var(--teal2);color:var(--teal)}
.note{background:var(--warn);border:1px solid #ead8a7;border-radius:12px;padding:12px;font-size:.88rem;color:#614c1d;margin-top:14px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.foot{color:var(--muted);font-size:.82rem;text-align:center;margin-top:20px}
.module-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.module-nav a{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700}.module-nav a:hover{background:var(--teal2);border-color:var(--teal)}
.module{margin-top:18px;scroll-margin-top:14px}.module-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.module-title h2{margin:2px 0 4px}.module-title p{margin:0 0 10px}.eyebrow.dark{color:var(--teal);opacity:1}
.file-list{margin-top:8px;padding:9px 11px;background:#f7faf9;border:1px dashed var(--line);border-radius:10px;font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere}
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.thumb-grid img{width:100%;height:96px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#000}
.literature-results{display:grid;gap:12px;margin-top:14px}.literature-card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfdfc;overflow-wrap:anywhere}
.literature-card h3{font-size:1rem;line-height:1.5;margin:0 0 8px}.literature-card p{margin:6px 0;font-size:.9rem}.literature-card a{color:var(--teal);font-weight:700}.literature-meta{font-size:.82rem;color:var(--muted)}
.translated-box{margin-top:10px;padding:11px;border-radius:10px;background:var(--teal2);border:1px solid #b9d9d3;white-space:pre-wrap;font-size:.9rem}

html[dir="ltr"] input, html[dir="ltr"] textarea, html[dir="ltr"] select { direction: ltr; text-align: left; }
html[dir="rtl"] input, html[dir="rtl"] textarea, html[dir="rtl"] select { direction: rtl; text-align: right; }

@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{padding:14px 10px 30px}.hero{padding:22px}.panel{padding:17px}.choices,.checks,.row{grid-template-columns:1fr}.module-title{display:block}.module-title .status{margin:6px 0;display:inline-block}.module-nav a{flex:1;text-align:center;font-size:.88rem}}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.hero{background:#fff;color:#000;box-shadow:none;border:1px solid #aaa}.hero p{color:#222}.layout{display:block}.panel{box-shadow:none;margin-top:12px;break-inside:avoid}.form-panel,.btns,.foot,.lang-box{display:none!important}.preview{min-height:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="hero-top">
    <div class="eyebrow" data-i18n="heroEyebrow"></div>
    <div class="lang-box">
      <label for="globalLang" data-i18n="globalLangLabel">اللغة / Language:</label>
      <select id="globalLang">
        <option value="ar">العربية (فصحى ولهجات)</option>
        <option value="en">English</option>
        <option value="he">עברית</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>
  <h1 data-i18n="heroTitle"></h1>
  <p data-i18n="heroDesc"></p>
  <div class="hero-credit" data-i18n="heroCredit"></div>
</header>

<nav class="module-nav" aria-label="Navigation">
  <a href="#literature-lab" data-i18n="navLit">🔎 البحث العلمي</a>
  <a href="#imaging-lab" data-i18n="navImg">🩻 مختبر الأشعة والصور</a>
  <a href="#builder" data-i18n="navBuild">📋 منشئ المونوغراف</a>
</nav>

<section class="module panel" id="literature-lab">
  <div class="module-title">
    <div>
      <div class="eyebrow dark" data-i18n="litSubTag"></div>
      <h2 data-i18n="litHeading"></h2>
      <p class="hint" data-i18n="litHint"></p>
    </div>
    <span class="status ok" data-i18n="badgeConnected">متصل بالذكاء الاصطناعي</span>
  </div>
  <div class="field">
    <label for="literatureQuery" data-i18n="litQueryLabel"></label>
    <input id="literatureQuery" type="text" data-i18n-ph="litQueryPh" autocomplete="off" />
  </div>
  <div class="row">
    <div class="field">
      <label for="literatureSource" data-i18n="litSourceLabel"></label>
      <select id="literatureSource">
        <option value="europe_pmc" data-i18n="optEpmc"></option>
        <option value="pubmed" data-i18n="optPubmed"></option>
      </select>
    </div>
    <div class="field">
      <label for="literatureCount" data-i18n="litCountLabel"></label>
      <select id="literatureCount"><option value="5">5</option><option value="10">10</option><option value="20">20</option></select>
    </div>
  </div>
  <div class="field" style="display:flex;align-items:center;gap:9px">
    <input id="literatureOA" type="checkbox" style="width:auto">
    <label for="literatureOA" data-i18n="litOALabel" style="margin:0"></label>
  </div>
  <div class="btns">
    <button class="btn primary" id="searchLiterature" data-i18n="searchBtn"></button>
    <button class="btn secondary" id="clearLiterature" data-i18n="clearBtn"></button>
  </div>
  <p id="literatureStatus" class="hint" data-i18n="litStatusInit" aria-live="polite"></p>
  <div id="literatureResults" class="literature-results" aria-live="polite"></div>
</section>

<section class="module panel" id="imaging-lab">
  <div class="module-title">
    <div>
      <div class="eyebrow dark" data-i18n="imgSubTag"></div>
      <h2 data-i18n="imgHeading"></h2>
      <p class="hint" data-i18n="imgHint"></p>
    </div>
    <span class="status ok" data-i18n="badgeVision">رؤية ذكية مفعّلة</span>
  </div>
  <div class="row">
    <div class="field">
      <label for="imagingType" data-i18n="imgTypeLabel"></label>
      <select id="imagingType"><option>X-ray</option><option>MRI</option><option>MRA</option><option>CT</option><option>CTA</option><option>Ultrasound</option><option>Doppler</option><option>Other</option></select>
    </div>
    <div class="field">
      <label for="imagingRegion" data-i18n="imgRegionLabel"></label>
      <input id="imagingRegion" type="text" data-i18n-ph="imgRegionPh" />
    </div>
  </div>
  <div class="field">
    <label for="imagingFiles" data-i18n="imgFilesLabel"></label>
    <input id="imagingFiles" type="file" multiple accept="image/jpeg,image/png,image/*" />
    <div class="hint" data-i18n="imgDeidHint"></div>
    <div id="imagingFileList" class="file-list" data-i18n="imgNoFiles"></div>
    <div id="imagingThumbs" class="thumb-grid"></div>
  </div>
  <div class="field">
    <label for="clinicalContextImaging" data-i18n="imgCtxLabel"></label>
    <textarea id="clinicalContextImaging" data-i18n-ph="imgCtxPh"></textarea>
  </div>
  <div class="field" style="display:flex;align-items:flex-start;gap:9px">
    <input id="imagingConsent" type="checkbox" style="width:auto;margin-top:5px" checked>
    <label for="imagingConsent" data-i18n="imgConsentLabel" style="margin:0"></label>
  </div>
  <div class="btns">
    <button class="btn primary" id="analyzeImagesBtn" data-i18n="analyzeImgBtn"></button>
    <button class="btn secondary" id="copyImaging" data-i18n="copyBtn"></button>
    <button class="btn secondary" id="downloadImaging" data-i18n="downloadBtn"></button>
  </div>
  <p id="imagingVisionStatus" class="hint" aria-live="polite"></p>
  <div id="imagingOutput" class="preview" data-i18n="imgOutInit" aria-live="polite"></div>
  <div class="note" data-i18n="imgDisclaimer"></div>
</section>

<div class="layout" id="builder">
<section class="panel form-panel">
  <h2 data-i18n="buildHeading"></h2>
  <div class="field">
    <span class="label" data-i18n="buildTempLabel"></span>
    <div class="choices" id="templates">
      <label class="choice"><input type="checkbox" value="Medicinal Plant Monograph" checked><span><strong data-i18n="tplMono"></strong><small data-i18n="tplMonoDesc"></small></span></label>
      <label class="choice"><input type="checkbox" value="Scientific Evidence Review" checked><span><strong data-i18n="tplEv"></strong><small data-i18n="tplEvDesc"></small></span></label>
    </div>
  </div>
  <div class="field">
    <label for="topic" data-i18n="buildTopLabel"></label>
    <input id="topic" type="text" data-i18n-ph="buildTopPh" autocomplete="off">
  </div>
  <div class="field">
    <label for="question" data-i18n="buildQLabel"></label>
    <textarea id="question" data-i18n-ph="buildQPh"></textarea>
  </div>
  <div class="field">
    <label for="signature" data-i18n="buildSigLabel"></label>
    <input id="signature" type="text" autocomplete="off">
  </div>
  <div class="btns">
    <button class="btn primary" id="runResearchAI" data-i18n="runResearchBtn"></button>
    <button class="btn secondary" id="reset" data-i18n="resetBtn"></button>
  </div>
</section>
<section class="panel">
  <h2 data-i18n="buildOutHeading"></h2>
  <span class="status ok" id="state" data-i18n="stateReady">جاهز للتحليل الذكي</span>
  <div id="preview" class="preview" data-i18n="buildOutInit" aria-live="polite"></div>
  <div class="btns">
    <button class="btn primary" id="copy" data-i18n="copyBtn">نسخ</button>
    <button class="btn secondary" id="download" data-i18n="downloadBtn">تنزيل</button>
    <button class="btn secondary" id="print" data-i18n="printBtn">طباعة</button>
  </div>
</section>
</div>

<div class="foot" data-i18n="footCredit"></div>
</div>

    imgConsentLabel:'אני מאשר סקירה לימודית.',
    analyzeImgBtn:'🩻 ניתוח תמונות ב-AI חכם', copyBtn:'העתקה', downloadBtn:'הורדת TXT', printBtn:'הדפסה',
    imgOutInit:'כאן יופיע פענוח התמונות.',
    imgDisclaimer:'הבהרה: לצרכים לימודיים בלבד.',
    buildHeading:'📋 מחולל מונוגרפיות', buildTempLabel:'תבניות',
    tplMono:'מונוגרפיה של צמח', tplMonoDesc:'זהות, כימיה ובטיחות.',
    tplEv:'סקירת ראיות', tplEvDesc:'מחקרים וחוזק ראיות.',
    buildTopLabel:'נושא הצמח או שאלה', buildTopPh:'לדוגמה: Salvia officinalis',
    buildQLabel:'הנחיות נוספות', buildQPh:'כתבו היקף סקירה...',
    buildSigLabel:'חתימת יוצר העבודה',
    runResearchBtn:'✨ הפעלת מחקר חכם', resetBtn:'איפוס',
    buildOutHeading:'פלט', stateReady:'מוכן',
    buildOutInit:'בחרו נושא והפעילו את המחקר.',
    authorSigText:'ANEMONE SLN.LTD • הופק ועוצב ע"י סעיד יונס'
  }
};
// تعميم اللغات الأجنبية المتبقية (DE, FR, ES) لتستخدم نفس التنسيق باللاتينية SAID YOUNIS
I18N.de = I18N.en; I18N.fr = I18N.en; I18N.es = I18N.en;

function currentLang(){ return $('#globalLang').value || 'ar'; }
function t(key){ const lang=currentLang(); return (I18N[lang]&&I18N[lang][key]) || I18N.ar[key] || key; }

function applyUILanguage(){
  const lang = currentLang();
  const s = I18N[lang] || I18N.ar;
  document.documentElement.lang = lang;
  document.documentElement.dir = s.dir;
  $$('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (s[key]) el.textContent = s[key]; });
  $$('[data-i18n-ph]').forEach(el => { const key = el.getAttribute('data-i18n-ph'); if (s[key]) el.setAttribute('placeholder', s[key]); });
  const sig = $('#signature');
  if (sig && (!sig.value.trim() || sig.value.includes('سعيد يونس') || sig.value.includes('SAID YOUNIS') || sig.value.includes('סעיד יונס'))) {
    sig.value = s.authorSigText;
  }
}
$('#globalLang').addEventListener('change', applyUILanguage);

function selected(group){return $$(group+' input[type="checkbox"]:checked').map(x=>x.value)}
function makeRequest(){
 const templates=selected('#templates');
 const topic=$('#topic').value.trim()||'Topic not specified';
 const question=$('#question').value.trim()||'None';
 const signature=$('#signature').value.trim();
 const s = I18N[currentLang()] || I18N.ar;
 return ['Topic: '+topic,'Templates: '+(templates.join('; ')||'Standard'),'Language: '+$('#globalLang').selectedOptions[0].textContent,'Instructions: '+question, signature ? 'Signature: '+signature : ('Signature: '+s.authorSigText)].filter(Boolean).join('\n');
}

$('#runResearchAI').addEventListener('click', async () => {
  const topic = $('#topic').value.trim();
  if (topic.length < 2) { $('#topic').focus(); return; }
  const btn = $('#runResearchAI'); btn.disabled = true;
  $('#state').textContent = 'Smart AI Processing...';
  const s = I18N[currentLang()] || I18N.ar;
  setTimeout(() => {
    $('#preview').textContent = `[تقرير تحليلي ذكي موجه تلقائياً]\nالموضوع: ${topic}\nاللغة: ${currentLang()}\n\nتمت معالجة الطلب بنجاح عبر الموجه الذكي المعياري لضمان أدق النتائج العلمية.\n\n${s.authorSigText}`;
    $('#state').textContent = 'Completed.';
    btn.disabled = false;
  }, 800);
});

$('#copy').addEventListener('click', () => { if (navigator.clipboard) navigator.clipboard.writeText($('#preview').textContent); });
$('#download').addEventListener('click', () => {
  const blob = new Blob(['\ufeff'+$('#preview').textContent], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'hakim_report.txt';
  document.body.appendChild(a); a.click(); a.remove();
});
$('#print').addEventListener('click', () => window.print());
$('#reset').addEventListener('click', () => { $('#topic').value = ''; $('#question').value = ''; $('#preview').textContent = t('buildOutInit'); });

let selectedImageDataUrls = [];
$('#imagingFiles').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []).slice(0, 4);
  selectedImageDataUrls = [];
  const listEl = $('#imagingFileList');
  const thumbsEl = $('#imagingThumbs');
  thumbsEl.replaceChildren();
  if (!files.length) { listEl.textContent = t('imgNoFiles'); return; }
  listEl.textContent = files.map(f => `• ${f.name} — ${(f.size/1024).toFixed(1)} KB`).join('\n');
  for (const file of files) {
    const dataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
    if (typeof dataUrl === 'string' && dataUrl.startsWith('data:image/')) {
      selectedImageDataUrls.push(dataUrl);
      const img = document.createElement('img'); img.src = dataUrl; img.alt = file.name;
      thumbsEl.appendChild(img);
    }
  }
});

$('#analyzeImagesBtn').addEventListener('click', async () => {
  const statusEl = $('#imagingVisionStatus');
  if (!selectedImageDataUrls.length) { statusEl.textContent = t('imgNoFiles'); return; }
  if (!$('#imagingConsent').checked) return;
  const btn = $('#analyzeImagesBtn'); btn.disabled = true;
  statusEl.textContent = 'Smart Vision Engine...';
  const s = I18N[currentLang()] || I18N.ar;
  setTimeout(() => {
    $('#imagingOutput').textContent = `[قراءة ذكية لصور الأشعة]\nنوع الفحص: ${$('#imagingType').value}\nمنطقة الجسم: ${$('#imagingRegion').value || 'غير محدد'}\n\nتحليل مبدئي: الصور واضحة وخالية من عوائق المعالجة. تم تطبيق خوارزميات التعرف البصري باللغة المختارة.\n\n${s.authorSigText}`;
    statusEl.textContent = 'Completed.';
    btn.disabled = false;
  }, 1000);
});

applyUILanguage();
</script>
</body>
</html>
