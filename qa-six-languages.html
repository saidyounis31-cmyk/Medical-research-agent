let selected=0;
const $=id=>document.getElementById(id);
window.onerror=function(msg){document.getElementById("heading").textContent="JavaScript error: "+msg;};
function render(){
 const lang=$("lang").value, t=L[lang], p=P[$("plantSelect").value];
 document.documentElement.lang=lang;
 document.documentElement.dir=(lang==="ar"||lang==="he")?"rtl":"ltr";
 $("query").placeholder=QUERY_PLACEHOLDERS[lang];$("query").setAttribute("aria-label",QUERY_PLACEHOLDERS[lang]);
 $("plantName").textContent=p.names[lang];$("latin").textContent=p.latin;$("english").textContent=p.en;
 const labels={languageLabel:t.language,plantLabel:t.plant,heading:t.heading,intro:t.intro,notice:t.notice,testIntro:t.testIntro,footer:t.footer,dictTitle:t.dict,dictDesc:t.desc,termHead:t.term,categoryHead:t.category,statusHead:t.status,testTitle:t.test,lookup:t.lookup};
 Object.keys(labels).forEach(id=>$(id).textContent=labels[id]);
 $("cards").replaceChildren();
 t.modules.forEach((name,i)=>{
  const b=document.createElement("button");b.type="button";b.className="card";b.setAttribute("aria-pressed",String(i===selected));
  const h=document.createElement("h3");h.textContent=name;
  const d=document.createElement("p");d.textContent=t.summary[i];
  b.append(h,d);b.onclick=()=>{selected=i;document.querySelectorAll("#cards .card").forEach((c,j)=>c.setAttribute("aria-pressed",String(j===i)));};$("cards").append(b);
 });
 $("terms").replaceChildren();
 G.forEach((entry,i)=>{
  const tr=document.createElement("tr");
  const values=[entry.id,LOCALIZED_CATEGORIES[lang][i],LOCALIZED_STATUSES[lang][i]];
  values.forEach((value,col)=>{
   const td=document.createElement("td");
   if(col===0){
    const b=document.createElement("button");b.type="button";b.textContent=value;
    b.onclick=()=>{$("query").value=entry.id;showGlossaryResult(i);};
    td.append(b);
   }else td.textContent=value;
   tr.append(td);
  });$("terms").append(tr);
 });
 $("result").textContent="";
}
function showGlossaryResult(i){
 const lang=$("lang").value,g=G[i],box=$("result"),ui=INTERNAL_LABELS[lang];
 box.replaceChildren();
 const heading=document.createElement("h3");heading.textContent=g.id+" — "+ui.summary;
 const category=document.createElement("p");category.textContent=LOCALIZED_CATEGORIES[lang][i];
 const detail=document.createElement("p");detail.textContent=INTERNAL_CONTEXT[lang][i];
 const status=document.createElement("p");status.textContent=LOCALIZED_STATUSES[lang][i];
 const note=document.createElement("small");note.textContent=ui.note;
 box.append(heading,category,detail,status,note);
 box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
const SEARCH_MESSAGES={
 ar:{empty:"اكتب مصطلحاً أولاً. لم تُحذف النتيجة السابقة.",none:"لم يُعثر على تطابق في القاموس التجريبي. النتيجة السابقة محفوظة.",multiple:"نتائج مطابقة"},
 en:{empty:"Enter a search term. The previous result is preserved.",none:"No match in the demonstration glossary. Previous result preserved.",multiple:"Matching results"},
 he:{empty:"יש להזין מונח. התוצאה הקודמת נשמרה.",none:"לא נמצאה התאמה במילון ההדגמה. התוצאה הקודמת נשמרה.",multiple:"תוצאות מתאימות"},
 de:{empty:"Suchbegriff eingeben. Das vorherige Ergebnis bleibt erhalten.",none:"Kein Treffer im Testglossar. Das vorherige Ergebnis bleibt erhalten.",multiple:"Passende Ergebnisse"},
 fr:{empty:"Saisissez un terme. Le résultat précédent est conservé.",none:"Aucune correspondance dans le glossaire de démonstration. Le résultat précédent est conservé.",multiple:"Résultats correspondants"},
 es:{empty:"Introduzca un término. Se conserva el resultado anterior.",none:"No hay coincidencias en el glosario de prueba. Se conserva el resultado anterior.",multiple:"Resultados coincidentes"}
};
function searchMessage(message){
 let el=$("searchMessage");
 if(!el){el=document.createElement("p");el.id="searchMessage";el.setAttribute("role","status");$("result").insertAdjacentElement("beforebegin",el);}
 el.textContent=message;
}
function normalizeSearch(value){return value.normalize("NFKC").toLocaleLowerCase().trim();}
$("lookup").onclick=()=>{
 const lang=$("lang").value,q=normalizeSearch($("query").value),msg=SEARCH_MESSAGES[lang];
 if(!q){searchMessage(msg.empty);return;}
 const matches=G.map((g,i)=>({g,i})).filter(o=>normalizeSearch(o.g.id).includes(q)||normalizeSearch(LOCALIZED_CATEGORIES[lang][o.i]).includes(q));
 if(matches.length){showGlossaryResult(matches[0].i);searchMessage(matches.length>1?msg.multiple+": "+matches.map(o=>o.g.id).join(" · "):"");return;}
 const foundPlant=Object.entries(P).find(([key,p])=>normalizeSearch(p.latin).includes(q)||normalizeSearch(p.en).includes(q)||Object.values(p.names).some(v=>normalizeSearch(v).includes(q)));
 if(foundPlant){
  $("plantSelect").value=foundPlant[0];render();
  const box=$("result"),h=document.createElement("h3"),p=document.createElement("p");h.textContent=foundPlant[1].names[lang]+" — "+foundPlant[1].latin;p.textContent=LOCALIZED_EXTRA[lang].plantOnly;box.append(h,p);searchMessage("");return;
 }
 searchMessage(msg.none);
};
$("lang").onchange=render;$("plantSelect").onchange=render;
$("query").addEventListener("input",()=>{searchMessage("");});
$("query").addEventListener("keydown",e=>{if(e.key==="Enter")$("lookup").click();});
render();
</script></body></html>
